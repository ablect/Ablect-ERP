name: Package Ablect Business Suite for Windows
on:
  workflow_dispatch:
  push:
    branches:
      - feat/modern-sales-pos
      - feat/modern-sales-pos-next
jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build Windows installer
        run: npm run package:win
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ablect-business-suite-windows-installer
          path: release/*.exe
